<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Traffic Theory V4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#0f6b3f;--accent-hi:#16915a;--money:#0f6b3f;--danger:#d93a2f;
  --glass:rgba(255,255,255,.86);--glass-b:rgba(255,255,255,.7);--text:#14181b;--muted:#5d666d;--chip:rgba(20,30,25,.065);
  --shadow:0 12px 32px rgba(8,20,12,.20),0 2px 6px rgba(8,20,12,.10);--yellow:#e6b522;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--glass:rgba(22,26,29,.84);--glass-b:rgba(255,255,255,.09);--text:#eef1f2;--muted:#9aa5ad;--chip:rgba(255,255,255,.08);--money:#47c486}}
:root[data-theme="dark"]{--glass:rgba(22,26,29,.84);--glass-b:rgba(255,255,255,.09);--text:#eef1f2;--muted:#9aa5ad;--chip:rgba(255,255,255,.08);--money:#47c486}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;background:#5f7f3e;font-family:"Overpass","Helvetica Neue",Arial,sans-serif;color:var(--text);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{position:fixed;inset:0;touch-action:none;display:block}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
html,body,.top,.bottom,.menu,.over,.glass{touch-action:manipulation}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.glass{background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--shadow);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5)}
.top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.wallet{pointer-events:auto;border-radius:20px;padding:9px 12px 9px 14px;min-width:0}
.money{font-weight:800;font-size:25px;line-height:1.05;letter-spacing:-.4px;color:var(--money);font-variant-numeric:tabular-nums}
.money.neg{color:var(--danger)}
.money.free{font-size:18px;color:var(--text)}
.chips{display:flex;gap:4px;margin-top:6px;flex-wrap:nowrap}
.chip{font-size:11px;font-weight:700;padding:3px 7px 2px;border-radius:999px;background:var(--chip);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{color:var(--text);font-weight:800}
.spacer{flex:1}
.iconbar{pointer-events:auto;display:flex;gap:2px;border-radius:999px;padding:4px}
.ib{width:40px;height:40px;border-radius:999px;border:0;background:transparent;display:grid;place-items:center;font-weight:800;font-size:13px;transition:background .15s}
.ib:active{background:var(--chip)}
.ib svg{width:20px;height:20px}
.ib[aria-pressed="false"]{opacity:.4}
.menu{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 62px);border-radius:18px;padding:6px;display:flex;flex-direction:column;min-width:210px}
.menu[hidden]{display:none}
.menu .brand{font-weight:800;font-size:13px;color:var(--accent);padding:8px 12px 7px;border-bottom:1px solid var(--chip);border-radius:12px 12px 0 0;margin-bottom:4px;gap:6px}
.ver{font-size:10.5px;font-weight:800;background:var(--accent);color:#fff;border-radius:999px;padding:2px 7px 1px}
.menu .brand em{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;color:var(--muted)}
.news{text-align:left;overflow:auto;margin:4px 0 14px;flex:1}
.news h4{margin:12px 0 6px;font-size:14px;font-weight:800;display:flex;gap:8px;align-items:center}
.news ul{margin:0;padding-left:18px}.news li{font-size:13.5px;line-height:1.45;margin-bottom:4px;color:var(--text)}
.menu button{display:flex;gap:11px;align-items:center;border:0;background:transparent;font-weight:700;font-size:15px;padding:12px 12px 11px;border-radius:12px;text-align:left}
.menu button:active{background:var(--chip)}
.menu svg{width:18px;height:18px;flex:none;color:var(--muted)}
.bottom{position:fixed;bottom:0;left:0;right:0;padding:0 8px calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.hint{pointer-events:auto;border-radius:16px;font-size:13px;font-weight:600;line-height:1.4;padding:9px 13px 8px;max-width:520px;text-align:center;transition:opacity .35s,transform .35s}
.hint.off{opacity:0;transform:translateY(8px);pointer-events:none}
.lanes{pointer-events:auto;display:flex;align-items:center;gap:10px;border-radius:999px;padding:5px 5px 5px 15px}
.lanes[hidden]{display:none}
.ll{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;font-weight:800;font-size:14px;min-width:54px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 10px;transition:background .15s,color .15s}
.seg button i{font-style:normal;font-size:10.5px;font-weight:700;opacity:.65}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(15,107,63,.35)}
.dock{pointer-events:auto;display:flex;gap:1px;width:100%;max-width:600px;border-radius:24px;padding:5px}
.tool{flex:1 1 0;min-width:0;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 5px;border-radius:18px;transition:background .18s,color .18s}
.ti{width:38px;height:30px;border-radius:11px;display:grid;place-items:center;background:var(--chip);transition:background .18s}
.tool svg{width:28px;height:20px}
.tool small{font-size:10.5px;font-weight:800;white-space:nowrap;letter-spacing:-.1px}
.pr{font-style:normal;font-size:9.5px;font-weight:700;color:var(--muted);margin-top:-2px;min-height:11px}
.tool[aria-pressed="true"]{background:var(--accent);color:#fff}
.tool[aria-pressed="true"] .ti{background:rgba(255,255,255,.2)}
.tool[aria-pressed="true"] .pr{color:rgba(255,255,255,.8)}
body[data-mode="free"] .pr,body[data-mode="free"] .seg i{visibility:hidden}
body[data-mode="game"] .free-only{display:none!important}
.spd{display:flex;align-items:center;gap:1px}.spd svg{width:15px;height:15px}.spd b{font-size:11.5px;font-weight:800}
.ib.on{background:var(--accent);color:#fff}
.paused{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 78px);transform:translateX(-50%);display:flex;gap:7px;align-items:center;border-radius:999px;padding:8px 14px 7px;font-size:12.5px;font-weight:800;white-space:nowrap;pointer-events:none;animation:pz 1.6s ease-in-out infinite}
.paused[hidden]{display:none}.paused svg{width:14px;height:14px;color:var(--accent)}
@keyframes pz{50%{opacity:.6}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 122px);transform:translate(-50%,-8px);background:rgba(18,22,25,.92);color:#fff;font-size:13.5px;font-weight:700;line-height:1.35;padding:10px 15px 9px;border-radius:16px;max-width:min(88vw,420px);text-align:center;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.over{position:fixed;inset:0;background:rgba(10,15,12,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px}
.over[hidden]{display:none}
.over .card{border-radius:26px;padding:24px 20px 18px;max-width:350px;width:100%;text-align:center}
.ov-ic{width:54px;height:54px;border-radius:18px;margin:0 auto 12px;display:grid;place-items:center;background:rgba(217,58,47,.12);font-size:28px}
.over b{font-size:22px;font-weight:800;display:block;margin-bottom:6px;letter-spacing:-.3px}
.over p{font-size:14px;line-height:1.45;margin:0 0 14px;color:var(--muted)}
.ostats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:16px}
.ostats div{background:var(--chip);border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;gap:2px}
.ostats span{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.ostats small{font-size:11px;font-weight:700;color:var(--muted)}
.obtns{display:flex;flex-direction:column;gap:8px}
.oscore{margin:-2px 0 12px;display:flex;flex-direction:column;align-items:center}
.oscore span{font-size:38px;font-weight:800;letter-spacing:-.8px;color:var(--money);font-variant-numeric:tabular-nums;line-height:1.05}
.oscore small{font-size:12.5px;font-weight:800;color:var(--muted);margin-top:2px}
.oscore small.rec{color:#d98a00}
.lbsend{display:flex;gap:6px;margin-bottom:8px}.lbsend[hidden]{display:none}
.lbsend input{flex:1;min-width:0;font:inherit;font-weight:700;font-size:15px;border:1px solid var(--glass-b);background:var(--chip);color:var(--text);border-radius:12px;padding:11px 12px 10px;outline:none}
.lbsend input:focus{border-color:var(--accent)}
.lbsend button{font-weight:800;font-size:14px;border:0;border-radius:12px;padding:0 14px;background:var(--accent);color:#fff;white-space:nowrap}
.lbstat{font-size:13px!important;font-weight:700;margin:0 0 12px!important;min-height:1em}
.lbcard{max-height:82vh;display:flex;flex-direction:column}
.lbtabs{margin:6px auto 12px;width:max-content}
.lblist{list-style:none;margin:0 0 10px;padding:0;overflow:auto;text-align:left;flex:1;min-height:120px}
.lblist li{display:flex;align-items:center;gap:10px;padding:9px 10px 8px;border-radius:12px;font-weight:700;font-size:14.5px}
.lblist li:nth-child(odd){background:var(--chip)}
.lblist li.me{outline:2px solid var(--accent)}
.lblist .rk{width:28px;text-align:center;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.lblist li:nth-child(1) .rk{color:#d4a017}.lblist li:nth-child(2) .rk{color:#9aa4ab}.lblist li:nth-child(3) .rk{color:#b87333}
.lblist .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lblist .sc{font-weight:800;font-variant-numeric:tabular-nums;color:var(--money)}
.lblist .em{color:var(--muted);text-align:center;display:block;padding:18px 0;font-weight:600}
.obtns button{font-weight:800;font-size:15px;border:0;border-radius:14px;padding:13px 16px 12px;background:var(--accent);color:#fff}
.obtns button.ghost{background:var(--chip);color:var(--text)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="top">
  <div class="wallet glass">
    <div class="money" id="title">$30,000</div>
    <div class="chips"><span class="chip" id="c1"></span><span class="chip" id="c2"></span><span class="chip" id="c3"></span><span class="chip" id="c4"></span></div>
  </div>
  <div class="spacer"></div>
  <div class="iconbar glass">
    <button class="ib" id="undo" aria-label="Hoàn tác"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="ib" id="pause" aria-label="Tạm dừng"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></button>
    <button class="ib" id="speed" aria-label="Tăng tốc"><span class="spd"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6.5v11l8-5.5zM12 6.5v11l8-5.5z"/></svg><b id="spdN">1×</b></span></button>
    <button class="ib" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>
</div>
<div class="menu glass" id="menu" hidden>
  <button class="brand" id="brand">Traffic Theory <span class="ver" id="verTag"></span><em>Có gì mới</em></button>
  <button id="openLb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Bảng xếp hạng</button>
  <button id="newgame"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Ván mới</button>
  <button id="sample"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3z"/><path d="M9 4v13M15 7v13"/></svg>Chế độ tự do</button>
  <button id="traffic" class="free-only" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16V11l2-5h10l2 5v5"/><path d="M3 16h18v3H3z"/></svg><span id="trafficLbl">Tắt xe</span></button>
  <button id="clear" class="free-only"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Xoá hết đường</button>
</div>

<div class="bottom">
  <div class="hint glass" id="hint"></div>
  <div class="lanes glass" id="lanes" hidden><span class="ll">Làn mỗi chiều</span><div class="seg" id="seg"></div></div>
  <nav class="dock glass" role="toolbar">
    <button class="tool" data-tool="local" aria-pressed="true"><span class="ti"><svg viewBox="0 0 30 22"><rect x="0" y="5" width="30" height="12" rx="1.5" fill="#cfcbc2"/><rect x="0" y="7" width="30" height="8" fill="#45484c"/><path d="M0 10.6h30M0 11.4h30" stroke="#e6b522" stroke-width=".6"/></svg></span><small>Đường</small><em class="pr" data-p="local">$12/m</em></button>
    <button class="tool" data-tool="highway" aria-pressed="false"><span class="ti"><svg viewBox="0 0 30 22"><rect x="0" y="2" width="30" height="18" rx="1.5" fill="#d4d0c6"/><rect x="0" y="3" width="30" height="16" fill="#3b3e42"/><path d="M0 11h30" stroke="#d9d6cf" stroke-width="1.4"/><path d="M0 6.5h30M0 15.5h30" stroke="#fff" stroke-width=".6" stroke-dasharray="3 3"/></svg></span><small>Cao tốc</small><em class="pr" data-p="highway">$90/m</em></button>
    <button class="tool" data-tool="ramp" aria-pressed="false"><span class="ti"><svg viewBox="0 0 30 22"><rect x="0" y="13" width="30" height="7" fill="#3b3e42"/><path d="M5 16.5 C16 16.5 20 12 27 3" stroke="#3b3e42" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M21.5 3.2l5.8-1.2-.9 5.9" stroke="#e6b522" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span><small>Lối ra</small><em class="pr" data-p="ramp">$45/m</em></button>
    <button class="tool" data-tool="bus" aria-pressed="false"><span class="ti"><svg viewBox="0 0 30 22"><rect x="3" y="3" width="24" height="14" rx="3.5" fill="#1f8a5a"/><rect x="6" y="5.5" width="18" height="5" rx="1.2" fill="#e4f3ea"/><circle cx="9" cy="17.5" r="2.4" fill="#222"/><circle cx="21" cy="17.5" r="2.4" fill="#222"/></svg></span><small>Buýt</small><em class="pr" data-p="bus">$2.5k</em></button>
    <button class="tool" data-tool="toll" aria-pressed="false"><span class="ti"><svg viewBox="0 0 30 22"><rect x="0" y="12" width="30" height="8" fill="#3b3e42"/><rect x="2" y="4" width="26" height="5" rx="1.2" fill="#f4f3ef" stroke="#d9432b" stroke-width="1"/><path d="M6 9v4M12 9v4M18 9v4M24 9v4" stroke="#8a8f94" stroke-width="1.6"/><text x="15" y="8.2" font-size="4.2" font-weight="800" text-anchor="middle" fill="#0f6b3f" font-family="Arial">BOT</text></svg></span><small>BOT</small><em class="pr" data-p="toll">$8k</em></button>
    <button class="tool" data-tool="doze" aria-pressed="false"><span class="ti"><svg viewBox="0 0 30 22"><rect x="7" y="4" width="15" height="10" rx="2.5" fill="#e6b522"/><rect x="2" y="14.5" width="25" height="5.5" rx="2.75" fill="#2f3337"/><path d="M22 8h5.5v6.5" stroke="#5b6066" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span><small>Phá dỡ</small><em class="pr" data-p="doze">+50%</em></button>
    <button class="tool" data-tool="pan" aria-pressed="false"><span class="ti"><svg viewBox="0 0 30 22"><path d="M15 2.5v17M6.5 11h17M15 2.5l-2.6 2.6M15 2.5l2.6 2.6M15 19.5l-2.6-2.6M15 19.5l2.6-2.6M6.5 11l2.6-2.6M6.5 11l2.6 2.6M23.5 11l-2.6-2.6M23.5 11l-2.6 2.6" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg></span><small>Kéo</small><em class="pr" data-p="pan"></em></button>
  </nav>
</div>
<div class="paused glass" id="paused" hidden><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>Đang tạm dừng · vẫn xây và chỉnh đường được</div>
<div class="toast" id="toast"></div>
<div class="over" id="news" hidden><div class="card glass lbcard"><b>Có gì mới</b><div class="news" id="newsBody"></div><div class="obtns"><button id="newsClose">Chơi tiếp</button></div></div></div>
<div class="over" id="lb" hidden><div class="card glass lbcard"><b>Bảng xếp hạng</b>
  <div class="seg lbtabs" id="lbTabs"><button data-p="all" aria-pressed="true">Tất cả</button><button data-p="week" aria-pressed="false">7 ngày</button><button data-p="day" aria-pressed="false">Hôm nay</button></div>
  <ol class="lblist" id="lbList"></ol><p class="lbstat" id="lbMe"></p>
  <div class="obtns"><button id="lbClose" class="ghost">Đóng</button></div></div></div>
<div class="over" id="over" hidden><div class="card glass"><div class="ov-ic">🚧</div><b id="overTitle"></b><p id="overText"></p>
  <div class="oscore"><span id="oScore">0</span><small id="oBest"></small></div>
  <div class="ostats"><div><span id="oTime">–</span><small>Thời gian</small></div><div><span id="oTrips">–</span><small>Chuyến</small></div><div><span id="oPop">–</span><small>Dân số</small></div></div>
  <div class="lbsend" id="lbSend" hidden><input id="pname" maxlength="20" placeholder="Tên của bạn" autocomplete="nickname"><button id="sendScore">Gửi điểm</button></div><p class="lbstat" id="lbStat"></p>
  <div class="obtns"><button id="again">Chơi lại</button><button id="openLb2" class="ghost">Bảng xếp hạng</button><button id="toFree" class="ghost">Chế độ tự do</button></div></div></div>

<script>
(()=>{
"use strict";
// Dán URL Web app của Apps Script (https://script.google.com/macros/s/.../exec) vào đây để bật bảng xếp hạng online
const LB_URL='';
const GAME_VERSION='V4';
const CHANGELOG=[

function updateGame(dt){

    if(d.D>=CAP){d.over+=dt;if(d.over>=OVER_T){gameOver('overload',d);return}}else d.over=Math.max(0,d.over-dt*.5);
    d.cd-=dt;if(d.cd<=0&&d.D-d.enRoute>=1){d.cd=dispatch(d)?0.5:1.5}}
  for(const l of lines)for(const X of l.stops){let dem=0;for(const d of dests)if(l.stops.some(Y=>Y!==X&&dist(d,Y.pt)<STOP_R))dem+=d.D;if(dem>=1)X.wait=Math.min(30,X.wait+X.nh*0.012*dt)}
  money-=(totalCost*0.00012+lines.reduce((a,l)=>a+l.buses,0)*0.5+tolls.length*0.3)*dt;
  tollT-=dt;if(tollT<=0){tollT=3;for(const t of tolls)if(t.pend>0){popup(t.pt.x,t.pt.y,'BOT +'+fmt(t.pend));t.pend=0}}if(money<-2000){gameOver('bankrupt');return}
  growT-=dt;if(growT<=0){growT=.7;growHouses()}
  ambT-=dt;if(ambT<=0){ambT=.25;const pop=houses.reduce((a,h)=>a+(h.built?POPW[h.level]:0),0);let n=0;for(const c of cars)if(c.amb)n++;const tg=Math.floor(pop*CARS_PER_HH);for(let i=0;i<Math.min(8,tg-n);i++)spawnAmbient()}
  upT-=dt;if(upT<=0){upT=1.6;upgradeHouses()}
  if(gtime>=nextDestAt){spawnDest();nextDestAt=gtime+Math.max(35,80-gtime/25)}
}

// ---------- pathfinding ----------
let dirCount=new Map();
function endT(e,d){return d>0?e.tB:neg(e.tA)}
function transitions(e,d,nb){const n=d>0?e.b:e.a;const tin=endT(e,d);const out=[];
  for(const f of incident(n)){if(f===e)continue;if(nb&&f.type!=='local')continue;const d2=f.a===n?1:-1;if(f.type==='ramp'&&d2<0)continue;const dd=dot(tin,awayDir(f,n));if(dd<-0.35)continue;out.push({e:f,d:d2,dd})}
  if(!out.length&&e.type!=='ramp')out.push({e,d:-d,dd:-1});return out}
function findPath(eS,sS,eT,sT,nb){

  if(eS===eT){const d=sT>=sS?1:-1;if(!(eS.type==='ramp'&&d<0))return{path:[{e:eS,d}],dist:Math.abs(sT-sS)}}

  const pop=()=>{const top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;if(l<heap.length&&heap[l].c<heap[m].c)m=l;if(r<heap.length&&heap[r].c<heap[m].c)m=r;if(m===i)break;[heap[m],heap[i]]=[heap[i],heap[m]];i=m}}return top};
  for(const d of[1,-1]){if(eS.type==='ramp'&&d<0)continue;const rem=d>0?eS.len-sS:sS;push({e:eS,d,c:rem/sp(eS.type),dist:rem,prev:null})}
  let fin=null,it=0;
  while(heap.length&&it++<30000){const st=pop();if(fin&&st.c>=fin.c)break;const key=st.e.id*2+(st.d>0?0:1);if(seen.has(key))continue;seen.add(key);
    const sigPen=signals.has(st.d>0?st.e.b:st.e.a)?2.5:0;for(const tr of transitions(st.e,st.d,nb)){const f=tr.e,d2=tr.d;
      if(f===eT){const part=d2>0?sT:eT.len-sT;const c=st.c+sigPen+part/sp(f.type)/(nb?.4:1);if(!fin||c<fin.c)fin={e:f,d:d2,c,dist:st.dist+part,prev:st}}
      if(seen.has(f.id*2+(d2>0?0:1)))continue;push({e:f,d:d2,c:st.c+sigPen+f.len/sp(f.type)*cong(f)+(tollOn.has(f.id)?2.5:0),dist:st.dist+f.len,prev:st})}}
  if(!fin)return null;const path=[];let x=fin;while(x){path.push({e:x.e,d:x.d});x=x.prev}path.reverse();return{path,dist:fin.dist}}

function stopAcc(p,R){let best=null,bd=R||30;for(const e of edges.values()){if(e.type!=='local')continue;const b=e.bb;if(p.x<b.minx-bd||p.x>b.maxx+bd||p.y<b.miny-bd||p.y>b.maxy+bd)continue;const r=nearestS(e,p);if(r.d<bd){bd=r.d;best={e,s:Math.max(3,Math.min(e.len-3,r.s))}}}if(best)best.pt=pointAt(best.e,best.s);return best}

function refreshStops(){for(const l of lines){for(const X of l.stops){X.acc=stopAcc(X.pt,40);if(X.acc)X.pt={x:X.acc.pt.x,y:X.acc.pt.y}}

  if(del){if(mode==='game'){money+=del*20;trips+=del}popup(X.pt.x,X.pt.y,'🚌 '+del+' khách · +'+fmt(del*20))}
  let nt=c.bus.to+c.bus.dir;if(nt<0||nt>=n){c.bus.dir*=-1;nt=c.bus.to+c.bus.dir;load=0}

  if(!setBusPath(c,c.dir>0?c.prog:c.e.len-c.prog,l.stops[nt]))c.dead=true}
function stopAtScreen(x,y){for(const l of lines)for(let i=0;i<l.stops.length;i++){const X=l.stops[i];const sx=(X.pt.x-view.x)*view.s+W/2,sy=(X.pt.y-view.y)*view.s+H/2;if(Math.hypot(sx-x,sy-y)<26)return{l,i}}return null}
function busDown(w,ev){if(over)return;const hit=stopAtScreen(ev.clientX,ev.clientY);

  const A=stopAcc(w,Math.max(30,26/view.s));if(!A){toast('Hãy đặt trạm buýt trên đường phố');drag=null;return}drag={kind:'bus',A,B:null,route:null}}

  ctx.lineCap='butt';

function hwPt(I,p,L){const d=(p.x-I.hw.x)*I.hw.tx+(p.y-I.hw.y)*I.hw.ty;return{x:I.hw.x+I.hw.tx*d+I.nx*L,y:I.hw.y+I.hw.ty*d+I.ny*L}}
function drawRampOverlay(list){ctx.lineJoin='round';ctx.lineCap='butt';for(const e of list)for(const W of['A','B'])rampEnd(e,W)}
function rampEnd(e,W){const I=e.ends&&e.ends[W];if(!I)return;
  const T=40,S=Math.min(e.len,I.C+8);if(S<T+5)return;
  const G=Math.min(S,Math.max(I.G,T+25)),N=Math.min(S,Math.max(I.N,G+10));
  const P=u=>pointAt(e,W==='A'?u:e.len-u);
  const offAt=(u,o)=>{const p=P(u),k=o*I.out;return{x:p.x-p.ty*k,y:p.y+p.tx*k}};
  const line=(u0,u1,f)=>{const r=[];if(u1<=u0)return r;for(let u=u0;u<u1;u+=3)r.push(offAt(u,f(u)));r.push(offAt(u1,f(u1)));return r};
  const hwl=(u0,u1,L)=>{const r=[];if(u1<=u0)return r;for(let u=u0;u<u1;u+=3)r.push(hwPt(I,P(u),L));r.push(hwPt(I,P(u1),L));return r};
  const tk=u=>{const k=Math.min(1,u/T);return k*k*(3-2*k)};
  const sl=(pts,w,st,dash)=>{if(pts.length>1)strokeLine(pts,w,st,dash)};
  const L1=line(0,S,u=>u<T?-6:-8.5),R1=line(0,S,u=>-3.3+11.8*tk(u));
  ctx.beginPath();pathPts(L1);for(let i=R1.length-1;i>=0;i--)ctx.lineTo(R1[i].x,R1[i].y);ctx.closePath();ctx.fillStyle=asphaltHw;ctx.fill();

    const dir=W==='A'?1:-1;ctx.beginPath();
    for(let u=G-12;u<N+12;u+=4.5){const p=hwPt(I,P(Math.max(0,u)),I.edge-2),tg=P(Math.max(0,u));const f=dir;ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+I.nx*16-tg.tx*12*f*(W==='A'?1:1),p.y+I.ny*16-tg.ty*12*f)}
    ctx.lineWidth=.9;ctx.strokeStyle='rgba(255,255,255,.8)';ctx.stroke();ctx.restore()}

function drawHouses(){

function drawTrees(){

    const s=t.r*2.2;ctx.drawImage(TREE_SPR[t.v],t.x-s*.46,t.y-s*.46,s,s)}

let tool='local',drag=null,hoverSnap=null;
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);

  VR={x0:view.x-W/2/s,y0:view.y-H/2/s,x1:view.x+W/2/s,y1:view.y+H/2/s};

  for(const comp of hwComponents(vis.highway))drawHighwayGroup(comp);
  drawTolls('road');

  drawTolls('canopy');

  // preview
  if(drag&&drag.kind==='build'&&drag.moved){
    const g=makeGeom(drag.start,drag.end,tool);
    if(g){const pe={type:tool,P:g.P,hwA:g.hwA,hwB:g.hwB,a:-1,b:-2,lanes:laneSel[tool]||1};geom(pe);
      const ok=dist(drag.start.pt,drag.end.pt)>=24;
      ctx.globalAlpha=.78;
      if(tool==='local')drawLocal([pe],[],true);else if(tool==='highway')drawHighwayGroup([pe]);else{drawLocal([],[pe],true);drawRampOverlay([pe])}
      ctx.globalAlpha=1;
      if(!ok){ctx.lineCap='round';strokeLine(pe.pts,6,'rgba(220,40,40,.6)')}
      for(const sn of[drag.start,drag.end]){ctx.beginPath();ctx.arc(sn.pt.x,sn.pt.y,7/s,0,6.283);ctx.fillStyle=sn.kind==='free'?'rgba(255,255,255,.9)':'#e6b522';ctx.fill();ctx.lineWidth=2/s;ctx.strokeStyle='#0f6b3f';ctx.stroke()}
      const mid=pointAt(pe,pe.len/2);const cost=pe.len*M_PER_UNIT*costPerM(tool,pe.lanes);const label=Math.round(pe.len*M_PER_UNIT)+' m'+(tool!=='ramp'?' · '+pe.lanes+' làn':'')+(mode==='game'?' · '+fmt(cost):'');const poor=mode==='game'&&cost>money;
      ctx.save();ctx.translate(mid.x,mid.y);ctx.scale(1/s,1/s);ctx.font='700 13px Overpass, Arial';const tw=ctx.measureText(label).width;
      ctx.fillStyle=poor?'#b3261e':'#0f6b3f';rr(-tw/2-7,-34,tw+14,22,5);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;rr(-tw/2-5,-32,tw+10,18,4);ctx.stroke();ctx.fillStyle='#fff';ctx.fillText(label,-tw/2,-18.5);ctx.restore();
    }
  }
  if(drag&&drag.kind==='doze'&&drag.w){ctx.beginPath();ctx.arc(drag.w.x,drag.w.y,16/s,0,6.283);ctx.strokeStyle='#e6b522';ctx.lineWidth=3/s;ctx.stroke()}
  if(drag&&drag.kind==='bus')drawBusPreview();

// ---------- input ----------
function toWorld(x,y){return{x:(x-W/2)/view.s+view.x,y:(y-H/2)/view.s+view.y}}
const pointers=new Map();let pinch=null;
function clampScale(s){return Math.max(.12,Math.min(4,s))}
function snapAngle(start,w){const A=start.pt,d=sub(w,A);const L=Math.round(len(d)/20)*20;const step=Math.PI/12;const a=Math.round(Math.atan2(d.y,d.x)/step)*step;return{x:A.x+Math.cos(a)*L,y:A.y+Math.sin(a)*L}}
function updateEnd(w){
  let s=findSnap(w,tool,drag.start.kind==='node'?drag.start.node.id:null);
  if(s.kind==='edge'&&drag.start.kind==='edge'&&s.e===drag.start.e&&Math.abs(s.t-drag.start.t)<.05)s={kind:'free',pt:w};
  if(s.kind==='free')s={kind:'free',pt:snapAngle(drag.start,w)};
  drag.end=s;drag.endW=w;
}
function relane(w){const R=Math.max(6,10/view.s);let best=null,bd=1e9;
  for(const e of edges.values()){if(e.type!==tool)continue;const b=e.bb,m=halfOf(e)+R;if(w.x<b.minx-m||w.x>b.maxx+m||w.y<b.miny-m||w.y>b.maxy+m)continue;const r=nearestOnEdge(e,w);if(r.d<halfOf(e)+R&&r.d<bd){bd=r.d;best=e}}
  if(!best)return;const nl=laneSel[tool];if(lanesOf(best)===nl){toast('Đường này đã có '+nl+' làn mỗi chiều');return}
  const chain=new Set([best]),st=[best];while(st.length){const e=st.pop();for(const nd of[e.a,e.b]){const same=incident(nd).filter(f=>f.type===tool);if(same.length!==2)continue;for(const f of same)if(!chain.has(f)&&lanesOf(f)===lanesOf(best)){chain.add(f);st.push(f)}}}
  let diff=0;for(const e of chain)diff+=e.len*M_PER_UNIT*(costPerM(tool,nl)-costPerM(tool,lanesOf(e)));const delta=mode==='game'?(diff>0?-diff:-diff*.5):0;
  if(mode==='game'&&-delta>money){toast('Không đủ tiền: cần '+fmt(-delta));return}
  pushUndo(delta);money+=delta;const ns=new Set();for(const e of chain){e.lanes=nl;e._off={};ns.add(e.a);ns.add(e.b)}
  if(tool==='highway')for(const e of[...edges.values()])if(e.type==='ramp'&&(ns.has(e.a)||ns.has(e.b)))regenRamp(e);
  changed();toast((diff>0?'Đã mở rộng lên ':'Đã thu hẹp còn ')+nl+' làn mỗi chiều'+(mode==='game'?(diff>0?' · '+fmt(diff):' · hoàn '+fmt(-diff*.5)):''))}
function dozeAt(w){
  if(dozeStop(w)||dozeToll(w))return;
  const R=Math.max(6,10/view.s);let best=null,bd=1e9;
  for(const type of['ramp','highway','local'])for(const e of edges.values()){if(e.type!==type)continue;const b=e.bb,m=halfOf(e)+R;if(w.x<b.minx-m||w.x>b.maxx+m||w.y<b.miny-m||w.y>b.maxy+m)continue;
    const r=nearestOnEdge(e,w);if(r.d<halfOf(e)*.8+R&&r.d<bd){bd=r.d;best=e}}

}
cv.addEventListener('pointerdown',ev=>{
  cv.setPointerCapture(ev.pointerId);pointers.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  document.getElementById('menu').hidden=true;
  if(pointers.size===2){
    if(drag&&drag.kind==='doze'&&drag.changed){undoStack[undoStack.length-1].delta=drag.refund||0;changed()}else if(drag&&drag.kind==='doze')undoStack.pop();
    drag=null;const[p1,p2]=[...pointers.values()];const mid={x:(p1.x+p2.x)/2,y:(p1.y+p2.y)/2};
    pinch={d0:dist(p1,p2),s0:view.s,mw:toWorld(mid.x,mid.y)};return}
  if(pointers.size>2)return;
  for(const it of indicators)if(Math.hypot(ev.clientX-it.x,ev.clientY-it.y)<22){camGoal={x:it.d.x,y:it.d.y};drag=null;return}
  camGoal=null;
  const w=toWorld(ev.clientX,ev.clientY);
  if(tool==='pan'||ev.button===1||ev.button===2){drag={kind:'pan',sx:ev.clientX,sy:ev.clientY,vx:view.x,vy:view.y}}
  else if(tool==='bus'){busDown(w,ev)}
  else if(tool==='toll'){drag={kind:'toll',sx:ev.clientX,sy:ev.clientY}}
  else if(tool==='doze'){if(over)return;pushUndo();drag={kind:'doze',changed:false,w};dozeAt(w)}
  else{const s=findSnap(w,tool);drag={kind:'build',start:s,end:s,endW:w,moved:false,sx:ev.clientX,sy:ev.clientY}}
});
cv.addEventListener('pointermove',ev=>{
  if(!pointers.has(ev.pointerId))return;pointers.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(pinch&&pointers.size>=2){const[p1,p2]=[...pointers.values()];const mid={x:(p1.x+p2.x)/2,y:(p1.y+p2.y)/2};
    view.s=clampScale(pinch.s0*dist(p1,p2)/pinch.d0);view.x=pinch.mw.x-(mid.x-W/2)/view.s;view.y=pinch.mw.y-(mid.y-H/2)/view.s;return}
  if(!drag)return;const w=toWorld(ev.clientX,ev.clientY);
  if(drag.kind==='pan'){view.x=drag.vx-(ev.clientX-drag.sx)/view.s;view.y=drag.vy-(ev.clientY-drag.sy)/view.s}
  else if(drag.kind==='doze'){drag.w=w;dozeAt(w)}
  else if(drag.kind==='bus'){busMove(w,ev)}
  else{if(Math.hypot(ev.clientX-drag.sx,ev.clientY-drag.sy)>6)drag.moved=true;if(drag.moved)updateEnd(w)}

function endPointer(ev){
  pointers.delete(ev.pointerId);
  if(pinch){if(pointers.size<2)pinch=null;return}
  if(!drag)return;
  if(drag.kind==='build'&&drag.moved){
    if(over){drag=null;return}
    const ln=laneSel[tool]||1;const g=makeGeom(drag.start,drag.end,tool);let cost=0;if(g){const pe={type:tool,P:g.P,hwA:g.hwA,hwB:g.hwB};geom(pe);cost=pe.len*M_PER_UNIT*costPerM(tool,ln)}
    if(mode==='game'&&cost>money){toast('Không đủ tiền: cần '+fmt(cost))}
    else{const snap=snapshot();const r=build(drag.start,drag.end,tool,drag.endW,ln);
      if(r==='ok'){const delta=mode==='game'?-cost:0;money+=delta;undoStack.push({snap,delta});if(undoStack.length>50)undoStack.shift();changed()}
      else toast(r==='dest'?'Không thể xây đè lên công trình':'Đoạn đường quá ngắn hoặc không nối được ở đây')}}
  else if(drag.kind==='build'&&!drag.moved&&!over&&(tool==='local'||tool==='highway')){relane(toWorld(ev.clientX,ev.clientY))}
  else if(drag.kind==='bus'){busUp()}
  else if(drag.kind==='toll'){if(Math.hypot(ev.clientX-drag.sx,ev.clientY-drag.sy)<12)placeToll(toWorld(ev.clientX,ev.clientY))}
  else if(drag.kind==='doze'){if(drag.changed){undoStack[undoStack.length-1].delta=drag.refund||0;changed()}else undoStack.pop()}

}
cv.addEventListener('pointerup',endPointer);cv.addEventListener('pointercancel',endPointer);
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',ev=>{ev.preventDefault();const before=toWorld(ev.clientX,ev.clientY);view.s=clampScale(view.s*Math.exp(-ev.deltaY*.0015));
  view.x=before.x-(ev.clientX-W/2)/view.s;view.y=before.y-(ev.clientY-H/2)/view.s},{passive:false});

  segEl.innerHTML=o.map(n=>'<button data-n="'+n+'" aria-pressed="'+(laneSel[tool]===n)+'">'+n+'<i>$'+costPerM(tool,n)+'</i></button>').join('');
  segEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{laneSel[tool]=+b.dataset.n;renderLanes();updatePrices()})}
document.querySelectorAll('.tool').forEach(b=>b.addEventListener('click',()=>{tool=b.dataset.tool;document.querySelectorAll('.tool').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));setHint();renderLanes()}));
document.getElementById('undo').onclick=()=>{if(over)return;if(!undoStack.length){toast('Không còn gì để hoàn tác');return}const u=undoStack.pop();restore(u.snap);if(mode==='game')money-=u.delta};
const tb=document.getElementById('traffic');tb.onclick=()=>{trafficOn=!trafficOn;document.getElementById('trafficLbl').textContent=trafficOn?'Tắt xe':'Bật xe';if(!trafficOn)cars=[];menu.hidden=true};
let paused=false,speed=1;const pzB=document.getElementById('pause'),spB=document.getElementById('speed'),pzBanner=document.getElementById('paused');
const PAUSE_SVG=pzB.innerHTML,PLAY_SVG='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>';
function setPaused(v){paused=v;pzB.innerHTML=v?PLAY_SVG:PAUSE_SVG;pzB.classList.toggle('on',v);pzB.setAttribute('aria-label',v?'Tiếp tục':'Tạm dừng');pzBanner.hidden=!v||!!over}
pzB.onclick=()=>setPaused(!paused);
spB.onclick=()=>{speed=speed>=3?1:speed+1;document.getElementById('spdN').textContent=speed+'×';spB.classList.toggle('on',speed>1);if(paused)setPaused(false);toast('Tốc độ '+speed+'×')};
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
let lastTouchEnd=0;document.addEventListener('touchend',e=>{const now=Date.now();const btn=e.target.closest&&e.target.closest('button');if(btn&&now-lastTouchEnd<350){e.preventDefault();btn.click()}lastTouchEnd=now},{passive:false});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();setPaused(!paused)}});
const menu=document.getElementById('menu');document.getElementById('menuBtn').onclick=()=>{menu.hidden=!menu.hidden};
document.getElementById('newgame').onclick=()=>{menu.hidden=true;newGame()};
document.getElementById('sample').onclick=()=>{menu.hidden=true;loadSample()};
document.getElementById('clear').onclick=()=>{pushUndo();nodes=new Map();edges=new Map();adj=new Map();cars=[];lines=[];changed();menu.hidden=true;toast('Đã xoá. Bấm Hoàn tác để lấy lại.')};
document.getElementById('again').onclick=()=>newGame();
document.getElementById('sendScore').onclick=sendScore;document.getElementById('pname').addEventListener('keydown',e=>{if(e.key==='Enter')sendScore()});
function openNews(){document.getElementById('menu').hidden=true;document.getElementById('newsBody').innerHTML=CHANGELOG.map(c=>'<h4><span class="ver">'+c.v+'</span>'+(c.v===GAME_VERSION?'Phiên bản hiện tại':'')+'</h4><ul>'+c.items.map(i=>'<li>'+i+'</li>').join('')+'</ul>').join('');document.getElementById('news').hidden=false;lsSet('tt.ver',GAME_VERSION)}
document.getElementById('verTag').textContent=GAME_VERSION;document.getElementById('brand').onclick=openNews;document.getElementById('newsClose').onclick=()=>{document.getElementById('news').hidden=true};
if(lsGet('tt.ver',null)!==GAME_VERSION)setTimeout(openNews,600);
document.getElementById('openLb').onclick=openLb;document.getElementById('openLb2').onclick=openLb;document.getElementById('lbClose').onclick=()=>{document.getElementById('lb').hidden=true};
document.querySelectorAll('#lbTabs button').forEach(b=>b.onclick=()=>{lbPeriod=b.dataset.p;loadLb()});
document.getElementById('toFree').onclick=()=>loadSample();
let toastT;function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2600)}
function applyMode(){document.body.dataset.mode=mode;if(typeof setPaused==='function')setPaused(false);document.getElementById('over').hidden=!over;setHint();renderLanes();updatePrices();updateStats()}
function updateStats(){const t1=document.getElementById('title'),c=[1,2,3,4].map(i=>document.getElementById('c'+i));
  if(mode==='game'){t1.textContent=fmt(money);t1.className='money'+(money<0?' neg':'');const pop=houses.reduce((a,h)=>a+(h.built?POPW[h.level]*4:0),0);if(!over)peakPop=Math.max(peakPop,pop);
    c[0].innerHTML='<b>'+pop.toLocaleString('en-US')+'</b> dân';c[1].innerHTML='<b>'+cars.length+'</b> xe';c[2].innerHTML='<b>'+trips.toLocaleString('en-US')+'</b> chuyến';
    c[3].innerHTML='<b>'+Math.floor(gtime/60)+':'+String(Math.floor(gtime%60)).padStart(2,'0')+'</b>';c[3].hidden=false}
  else{let L=0;for(const e of edges.values())L+=e.len;t1.textContent='Traffic Theory';t1.className='money free';
    c[0].innerHTML='<b>'+(L*M_PER_UNIT/1000).toFixed(1)+'</b> km';c[1].innerHTML='<b>'+cars.length+'</b> xe';c[2].innerHTML='<b>'+lines.length+'</b> tuyến';c[3].innerHTML='Tự do';c[3].hidden=false}}
setInterval(()=>{updateStats();refreshCatch();keepBuses();if(mode==='game'&&!over)save()},1000);

// ---------- sample map ----------
function B(type,x1,y1,x2,y2,ln){const a=findSnap({x:x1,y:y1},type,null,12);const b=findSnap({x:x2,y:y2},type,a.kind==='node'?a.node.id:null,12);
  if(b.kind==='free')b.pt={x:x2,y:y2};if(a.kind==='free')a.pt={x:x1,y:y1};build(a,b,type,{x:x2,y:y2},ln)}
function resetWorld(){lines=[];tolls=[];tollOn=new Map();nodes=new Map();edges=new Map();adj=new Map();cars=[];nid=1;eid=1;dests=[];houses=[];builtPts=[];undoStack=[];nodeBusy.clear();popups=[];over=null}
function newGame(){resetWorld();mode='game';money=START_MONEY;gtime=0;trips=0;tollTotal=0;peakPop=0;submitted=false;nextDestAt=50;did=1;growT=0;
  B('local',-360,0,360,0);B('local',0,-240,0,240);
  dests.push(mkDest(230,54,0),mkDest(-340,-280,1));
  changed();for(let i=0;i<8;i++)growHouses();changed();
  view.x=0;view.y=-40;view.s=Math.max(.45,Math.min(.9,W/800));applyMode();}
function loadSample(){
  resetWorld();mode='free';
  B('highway',-3000,0,-1800,0,3);B('highway',-1800,0,800,0,3);B('highway',800,0,1700,-400,3);B('highway',1700,-400,3000,-600,3);
  B('highway',-1500,-3000,-1500,-900);B('highway',-1500,-900,-1500,900);B('highway',-1500,900,-1700,3000);
  for(const y of[200,480,-200,-480])B('local',-1000,y,1000,y,y===200||y===-200?2:1);
  B('local',-300,-480,-300,480,2);
  for(const x of[-900,-600,0,300,600,900]){B('local',x,200,x,480);B('local',x,-480,x,-200)}
  for(const x of[-600,300])B('local',x,480,x,760);
  B('local',-1000,480,-1000,900);B('local',1000,-480,1300,-760);
  B('ramp',0,0,600,200);
  B('ramp',-900,200,-600,0);
  B('ramp',600,0,0,-200);
  B('ramp',-600,-200,-1000,0);
  changed();applyMode();
}

// ---------- boot ----------
let loaded=false;
try{const raw=localStorage.getItem('xayduong.save4');if(raw){const g=JSON.parse(raw);mode=g.mode;money=g.money;gtime=g.gtime;trips=g.trips;tollTotal=g.tollTotal||0;peakPop=g.peakPop||0;submitted=!!g.submitted;nextDestAt=g.nextDestAt;did=g.did;over=g.over||null;
  dests=g.dests.map(d=>({...d,enRoute:0,cd:1,acc:null}));builtPts=g.built||[];houses=[];tolls=(g.tolls||[]).map(t=>({pt:{x:t.x,y:t.y},earned:t.earned||0,pend:0,acc:null}));lines=(g.lines||[]).map(x=>{const l=mkLine(x.stops||[x.A,x.B]);l.buses=x.buses;l.color=x.color;return l});restoreGraph(g.graph);changed();loaded=true;
  if(over){document.getElementById('overTitle').textContent='Ván trước đã kết thúc';document.getElementById('overText').textContent='Bạn đã chở '+trips+' chuyến.'}}}catch(err){console.error(err)}
if(!loaded)newGame();else{view.s=Math.max(.3,Math.min(.8,W/900));applyMode()}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!over&&!paused)for(let i=0;i<speed;i++){updateGame(dt);updateCars(dt)}if(camGoal){view.x+=(camGoal.x-view.x)*Math.min(1,dt*6);view.y+=(camGoal.y-view.y)*Math.min(1,dt*6);if(Math.hypot(camGoal.x-view.x,camGoal.y-view.y)<2)camGoal=null}for(const p of popups)p.t+=dt;popups=popups.filter(p=>p.t<1.4);render();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
