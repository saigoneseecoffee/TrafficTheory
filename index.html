<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Traffic Theory</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Traffic Theory">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#6b8a44">
<style>
  :root{color-scheme:light dark;--a:#0f6b3f}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:"Helvetica Neue",Arial,sans-serif;background:#6b8a44;padding:20px;box-sizing:border-box}
  .card{background:rgba(255,255,255,.9);border-radius:24px;padding:24px 20px;max-width:360px;width:100%;box-shadow:0 12px 32px rgba(0,0,0,.2)}
  @media (prefers-color-scheme:dark){.card{background:rgba(22,26,29,.9);color:#eef1f2}}
  h1{margin:0 0 4px;font-size:24px;color:var(--a)}
  p{margin:0 0 16px;font-size:14px;opacity:.75}
  a{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:inherit;padding:12px 14px;border-radius:14px;background:rgba(15,107,63,.08);margin-bottom:8px;font-weight:700}
  a span{font-size:13px;opacity:.7;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <h1>Traffic Theory</h1>
  <p id="msg">Đang mở bản mới nhất...</p>
  <div id="list"></div>
</div>
<script>
  // Trang này không cần sửa nữa. Mỗi lần ra bản mới chỉ cần up file vN.html (v4.html, v5.html, ...).
  // Trang tự tìm file có số lớn nhất và mở nó. Thêm ?versions vào địa chỉ để xem danh sách phiên bản.
  var MAX = 99;
  var showList = /[?&]versions\b/.test(location.search);
  function exists(n) {
    return fetch('v' + n + '.html', { method: 'HEAD', cache: 'no-store' })
      .then(function (r) { return r.ok ? n : 0; })
      .catch(function () { return 0; });
  }
  var checks = [];
  for (var i = 1; i <= MAX; i++) checks.push(exists(i));
  Promise.all(checks).then(function (res) {
    var found = res.filter(Boolean);
    if (!found.length) { document.getElementById('msg').textContent = 'Chưa có phiên bản nào. Hãy up file v1.html.'; return; }
    var latest = Math.max.apply(null, found);
    if (!showList) { location.replace('v' + latest + '.html' + location.hash); return; }
    document.getElementById('msg').textContent = 'Chọn phiên bản để chơi.';
    document.getElementById('list').innerHTML = found.sort(function (a, b) { return b - a; }).map(function (n) {
      return '<a href="v' + n + '.html">V' + n + (n === latest ? '<span>mới nhất</span>' : '') + '</a>';
    }).join('');
  });
</script>
</body>
</html>
